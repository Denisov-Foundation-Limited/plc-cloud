version: "3.9"

services:
  plc-cloud:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plc-cloud
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PLC_CLOUD_SEED_SAMPLE: "${PLC_CLOUD_SEED_SAMPLE:-0}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
